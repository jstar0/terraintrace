[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "terraintrace"
version = "0.1.0"
description = "A reproducible synthetic terrain reconstruction benchmark"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "JStar" }]
dependencies = [
  "fastapi>=0.115",
  "numpy>=2.2,<3",
  "python-multipart>=0.0.9",
  "uvicorn[standard]>=0.30",
]

[project.scripts]
terraintrace = "terraintrace.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.3,<9",
  "ruff>=0.9,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/terraintrace"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
