name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
      - run: uv sync --locked --dev
      - run: uv run pytest
      - run: uv run --with ruff ruff check src tests
      - run: uv lock --check
      - run: uv build
